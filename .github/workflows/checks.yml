name: Portable checks

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: mcp/.nvmrc
          package-manager-cache: false

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Install metadata test dependency
        run: >-
          Rscript --vanilla -e 'install.packages("jsonlite", repos = "https://cloud.r-project.org");
          stopifnot(requireNamespace("jsonlite", quietly = TRUE))'

      - name: Install locked Node dependencies
        working-directory: mcp
        run: npm ci

      - name: Build MCP server
        working-directory: mcp
        run: npm run build

      - name: MCP unit tests
        working-directory: mcp
        run: npm test

      - name: Audit gates and package maintenance tests
        run: node --test scripts/audit-results.test.mjs scripts/package-maintenance.test.mjs

      - name: Workflow orchestration fixtures
        run: node --test workflow/did-analysis.test.mjs

      - name: Check generated package inventory
        run: node scripts/package-maintenance.mjs check

      - name: Installed help lookup fixtures (base R only)
        run: Rscript --vanilla skill/scripts/tests/package-doc.test.R
